<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Lớp 9.27</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="nav-container">

            <a class="logo" href="index.html">
                🌟 9.27
            </a>

            <div class="nav-links">

                <a href="index.html">
                    🏠 <span>Trang chủ</span>
                </a>

                <a href="thongbao.html">
                    📢 <span>Thông báo</span>
                </a>

                <a href="hoctap.html">
                    📚 <span>Học tập</span>
                </a>

                <a href="thanhvien.html">
                    👥 <span>Thành viên</span>
                </a>

                <a href="hoatdong.html">
                    📸 <span>Hoạt động</span>
                </a>

            </div>

            <a class="login-button active-login" href="dangnhap.html">
                👤 Đăng nhập
            </a>

        </div>
    </nav>


    <main class="login-page">

        <section class="login-card">

            <div class="login-icon">
                👤
            </div>

            <h1>Đăng nhập</h1>

            <p class="login-subtitle">
                Đăng nhập vào tài khoản lớp 9.27
            </p>


            <form>

                <div class="form-group">

                    <label for="username">
                        👤 Tài khoản
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tài khoản"
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        🔒 Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit" class="login-submit">
                    Đăng nhập
                </button>

            </form>


            <p class="login-note">
                Tài khoản được cấp cho thành viên lớp 9.27.
            </p>


            <a class="back-home" href="index.html">
                ← Quay lại trang chủ
            </a>

        </section>

    </main>


    <footer>
        <p>🌟 Lớp 9.27 • Đoàn kết - Học tập - Vươn lên</p>
    </footer>

</body>

</html>
