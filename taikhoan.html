<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tài khoản - Lớp 9.27</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- ================================ -->
    <!-- THANH ĐIỀU HƯỚNG -->
    <!-- ================================ -->

    <nav>

        <div class="nav-container">


            <a class="logo"
               href="index.html">

                🌟 9.27

            </a>


            <div class="nav-links">


                <a href="index.html">
                    🏠 <span>Trang chủ</span>
                </a>


                <a href="thongbao.html">
                    📢 <span>Thông báo</span>
                </a>


                <a href="hoctap.html">
                    📚 <span>Học tập</span>
                </a>


                <a href="thanhvien.html">
                    👥 <span>Thành viên</span>
                </a>


                <a href="hoatdong.html">
                    📸 <span>Hoạt động</span>
                </a>


            </div>


            <a
                class="login-button"
                href="taikhoan.html"
            >

                👤 Tài khoản

            </a>


        </div>

    </nav>



    <!-- ================================ -->
    <!-- TRANG TÀI KHOẢN -->
    <!-- ================================ -->

    <main class="login-page">


        <section class="account-card">


            <!-- ICON -->

            <div
                class="account-avatar"
                id="accountRoleIcon"
            >

                👤

            </div>



            <!-- TÊN -->

            <h1 id="accountName">
                Tài khoản
            </h1>



            <!-- USERNAME -->

            <p
                class="account-username"
                id="accountUsername"
            >

                @username

            </p>



            <!-- ROLE -->

            <div
                id="accountRole"
                class="role-badge role-npc"
            >

                NPC

            </div>



            <!-- MÔ TẢ ROLE -->

            <p
                class="account-role-description"
                id="accountRoleDescription"
            >

                Thành viên

            </p>



            <!-- THÔNG TIN -->

            <div class="account-info">


                <div class="account-info-row">

                    <span>
                        👤 Họ tên
                    </span>

                    <strong id="accountName2">
                        —
                    </strong>

                </div>


                <div class="account-info-row">

                    <span>
                        🔑 Username
                    </span>

                    <strong id="accountUsername2">
                        —
                    </strong>

                </div>


                <div class="account-info-row">

                    <span>
                        🏷️ Role
                    </span>

                    <strong id="accountRole2">
                        —
                    </strong>

                </div>


            </div>



            <!-- ĐĂNG XUẤT -->

            <button
                class="login-submit logout-button"
                id="logoutButton"
            >

                🚪 Đăng xuất

            </button>



            <a
                class="back-home"
                href="index.html"
            >

                ← Về trang chủ

            </a>


        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            🌟 Lớp 9.27 • Đoàn kết - Học tập - Vươn lên
        </p>

    </footer>



    <script src="script.js"></script>


    <!-- HIỂN THỊ THÊM THÔNG TIN -->

    <script>

        const savedAccount =
            localStorage.getItem("loggedInUser");


        if (savedAccount) {

            const user =
                JSON.parse(savedAccount);


            document.getElementById(
                "accountName2"
            ).textContent =
                user.name;


            document.getElementById(
                "accountUsername2"
            ).textContent =
                "@" + user.username;


            document.getElementById(
                "accountRole2"
            ).textContent =
                user.role;

        }

    </script>

</body>

</html>
